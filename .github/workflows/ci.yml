name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run engine unit tests
        run: node tests/engine.test.mjs
      - name: Syntax check all JS modules
        run: |
          for f in $(find src -name '*.js'); do
            node --input-type=module --check < "$f" || exit 1
          done
          echo "All modules parsed successfully."
